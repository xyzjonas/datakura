{% load static %}
<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1976d2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="sentry-dsn" content="{{ sentry_dsn }}">
    <meta name="sentry-environment" content="{{ sentry_environment }}">
    <title>Datakura</title>
    {% if vite_css %}
    <link rel="stylesheet" crossorigin href="{% static vite_css %}">
    {% endif %}
    {% if vite_js %}
    <script type="module" crossorigin src="{% static vite_js %}"></script>
    {% endif %}
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
